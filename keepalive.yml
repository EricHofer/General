name: keep-supabase-awake

on:
  schedule:
    - cron: '17 5 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          curl --fail --silent --show-error \
            "https://ocyvfffnjnsnezeznwly.supabase.com/rest/v1/heartbeat?select=*&limit=1" \
            -H "apikey: sb_publishable_BIMLHjxT3am22F0aX76npA_Izgx4LAW" \
            -H "Authorization: Bearer sb_publishable_BIMLHjxT3am22F0aX76npA_Izgx4LAW"