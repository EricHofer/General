name: keep-supabase-awake

on:
  schedule:
    - cron: '17 5 * * 1,4'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Call keepalive endpoint
        env:
          KEEPALIVE_URL: ${{ secrets.KEEPALIVE_URL }}
          KEEPALIVE_TOKEN: ${{ secrets.KEEPALIVE_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            --retry 2 \
            --retry-delay 10 \
            -H "Authorization: Bearer $KEEPALIVE_TOKEN" \
            "$KEEPALIVE_URL"